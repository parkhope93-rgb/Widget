<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To-do Schedule</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=42dot+Sans:wght@400;500;600;700&family=Noto+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="globals.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="to-do" data-view="todo">
        <header>
            <nav class="weekbox">
                <button class="week-nav-btn prev-week" type="button" data-action="prev-week" aria-label="이전 주">
                    <img class="icon week-icon" src="img/lastweek.svg" alt="">
                </button>
                <div class="week-days">
                    <span class="date-slider" aria-hidden="true"></span>
                    <button class="datebutton" type="button" data-action="select-date"></button>
                    <button class="datebutton" type="button" data-action="select-date"></button>
                    <button class="datebutton" type="button" data-action="select-date"></button>
                    <button class="datebutton" type="button" data-action="select-date"></button>
                    <button class="datebutton" type="button" data-action="select-date"></button>
                    <button class="datebutton" type="button" data-action="select-date"></button>
                    <button class="datebutton" type="button" data-action="select-date"></button>
                </div>
                <button class="week-nav-btn next-week" type="button" data-action="next-week" aria-label="다음 주">
                    <img class="icon week-icon" src="img/lastweek.svg" alt="">
                </button>
            </nav>
            <nav class="filterbox">
                <span class="filter-slider" aria-hidden="true"></span>
                <button class="filter is-active" type="button" data-action="switch-view" data-view="todo">
                    <img class="icon filter-icon" src="img/Circular.svg" alt="">
                    <span class="filter-text">To-do</span>
                </button>
                <button class="filter" type="button" data-action="switch-view" data-view="done">
                    <img class="icon filter-icon" src="img/Check.svg" alt="">
                    <span class="filter-text">Done</span>
                </button>
                <button class="filter" type="button" data-action="switch-view" data-view="hold">
                    <img class="icon filter-icon" src="img/Clock.svg" alt="">
                    <span class="filter-text">In Hold</span>
                </button>
            </nav>
        </header>
        <div class="list-wrap">
            <p class="hold-watermark" aria-hidden="true">MIRUJI MARA</p>
            <div class="categorybox" id="item-list"></div>
        </div>
        <div class="composer">
            <form class="addbox" id="add-form">
                <input class="task-input" type="text" placeholder="또 뭘 해야 하니~" autocomplete="off">
                <div class="add-buttons">
                    <button class="add-icon is-selected" type="button" data-action="select-category" data-category="SCHEDULE">
                        <img src="img/add_cal_icon.svg" alt="SCHEDULE">
                    </button>
                    <button class="add-icon" type="button" data-action="select-category" data-category="SKKU">
                        <img src="img/add_skku_icon.svg" alt="SKKU">
                    </button>
                    <button class="add-icon" type="button" data-action="select-category" data-category="ESF">
                        <img src="img/esf.svg" alt="ESF">
                    </button>
                    <button class="add-icon" type="button" data-action="select-category" data-category="MRCC">
                        <img src="img/add_mrcc_icon.svg" alt="MRCC">
                    </button>
                    <button class="add-icon" type="button" data-action="select-category" data-category="GUITAR">
                        <img src="img/guitar.svg" alt="GUITAR">
                    </button>
                </div>
            </form>
            <button class="toggle-form-btn" type="button" data-action="toggle-panel" aria-label="할 일 추가"></button>
        </div>
    </main>
    <script src="app.js"></script>
</body>

</html>
