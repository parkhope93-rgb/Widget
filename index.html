<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo List</title>

<style>
body {
    font-family: sans-serif;
    max-width: 500px;
    margin: 40px auto;
    padding: 20px;
}

h1 {
    text-align: center;
}

.input-area {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    padding: 10px;
}

button {
    padding: 10px 15px;
    cursor: pointer;
}

ul {
    list-style: none;
    padding: 0;
}

li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    margin-top: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
}

.completed {
    text-decoration: line-through;
    opacity: 0.5;
}
</style>
</head>

<body>

<h1>📝 Todo List</h1>

<div class="input-area">
    <input id="todoInput" type="text" placeholder="할 일을 입력하세요">
    <button onclick="addTodo()">추가</button>
</div>

<ul id="todoList"></ul>

<script>
function addTodo() {
    const input = document.getElementById("todoInput");
    const text = input.value.trim();

    if (text === "") return;

    const li = document.createElement("li");

    li.innerHTML = `
        <span>${text}</span>
        <div>
            <button onclick="toggleTodo(this)">✔</button>
            <button onclick="deleteTodo(this)">🗑</button>
        </div>
    `;

    document.getElementById("todoList").appendChild(li);

    input.value = "";
}

function deleteTodo(button) {
    button.closest("li").remove();
}

function toggleTodo(button) {
    const text = button.closest("li").querySelector("span");
    text.classList.toggle("completed");
}

document.getElementById("todoInput")
.addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        addTodo();
    }
});
</script>

</body>
</html>
