<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To-do Schedule</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=42dot+Sans:wght@400;500;600;700&family=Noto+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="globals.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="to-do" data-page="todo" data-view="todo">
        <div class="board">
            <section class="board-left">
                <div class="brand">
                    <img class="mascot" src="img/왈랄라씨.png" alt="">
                    <p class="slogan">왈랄라하게 살자!</p>
                </div>
                <div class="calendar">
                    <div class="calendar-toolbar">
                        <h2 class="calendar-month" id="calendar-month"></h2>
                        <div class="done-count">
                            <span class="done-badge" aria-hidden="true"></span>
                            <span id="done-count-num">0</span>
                        </div>
                        <div class="month-nav">
                            <button class="month-nav-btn" type="button" data-action="prev-month" aria-label="이전 달">
                                <img class="week-icon" src="img/lastweek.svg" alt="">
                            </button>
                            <button class="month-nav-btn next-month" type="button" data-action="next-month" aria-label="다음 달">
                                <img class="week-icon" src="img/lastweek.svg" alt="">
                            </button>
                        </div>
                    </div>
                    <div class="calendar-weekdays" aria-hidden="true">
                        <span class="is-sun">S</span>
                        <span>M</span>
                        <span>T</span>
                        <span>W</span>
                        <span>T</span>
                        <span>F</span>
                        <span class="is-sat">S</span>
                    </div>
                    <div class="calendar-grid" id="calendar-grid"></div>
                </div>
            </section>
            <section class="board-right">
                <nav class="page-tabs">
                    <button class="page-tab is-active" type="button" data-action="switch-page" data-page="todo">To Do</button>
                    <button class="page-tab" type="button" data-action="switch-page" data-page="memo">Memo</button>
                </nav>
                <div class="list-wrap">
                    <p class="hold-watermark" aria-hidden="true">MIRUJI MARA</p>
                    <div class="categorybox" id="item-list"></div>
                </div>
                <div class="memo-wrap">
                    <textarea class="memo-input" id="memo-input" placeholder="풰"></textarea>
                </div>
            </section>
        </div>
        <div class="composer">
            <form class="addbox" id="add-form">
                <input class="task-input" type="text" placeholder="또 뭐 왜 그만해 하지마" autocomplete="off">
                <div class="add-buttons">
                    <button class="add-icon is-selected" type="button" data-action="select-category" data-category="SCHEDULE">
                        <img src="img/add_cal_icon.svg" alt="SCHEDULE">
                    </button>
                    <button class="add-icon" type="button" data-action="select-category" data-category="SKKU">
                        <img src="img/add_skku_icon.svg" alt="SKKU">
                    </button>
                    <button class="add-icon" type="button" data-action="select-category" data-category="ESF">
                        <img src="img/esf.svg" alt="ESF">
                    </button>
                    <button class="add-icon" type="button" data-action="select-category" data-category="MRCC">
                        <img src="img/add_mrcc_icon.svg" alt="MRCC">
                    </button>
                    <button class="add-icon" type="button" data-action="select-category" data-category="GUITAR">
                        <img src="img/guitar.svg" alt="GUITAR">
                    </button>
                </div>
            </form>
            <button class="toggle-form-btn" type="button" data-action="toggle-panel" aria-label="할 일 추가"></button>
        </div>
    </main>
    <script src="app.js"></script>
</body>

</html>
